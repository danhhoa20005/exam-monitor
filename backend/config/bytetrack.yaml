# ByteTrack Configuration for VisionGuard AI
# Tuned for classroom exam surveillance
tracker_type: bytetrack
track_high_thresh: 0.5    # Threshold for high score detection
track_low_thresh: 0.1     # Threshold for low score detection
new_track_thresh: 0.6     # Threshold for creating a new track
track_buffer: 30          # Buffer frames to keep lost tracks
match_thresh: 0.8         # Matching threshold for association
fuse_score: True
